<!DOCTYPE html> 
<html>
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <div style="text-align:center">
        <button onclick="playPause()">
            Play/Pause
        </button>
        <button onclick="makeBig()">
            Big
        </button>
        <button onclick="makeSmall()">
            Small
        </button>
        <button onclick="makeNormal()">
            Normal
        </button>
        <br><br>
        
        <video id="vdo" width="450">
            <source src="mov_bbb.mp4" type="video/mp4">
            <source src="mov_bbb.ogg" type="video/ogg">
            Your browser does not support HTML video.
        </video>
    </div>

   <p>Video courtesy of <a href="https://www.bigbuckbunny.org/" target="_blank">Big Buck Bunny</a>.</p>
   
    <script>
        var myVideo = document.getElementById("vdo");

        function playPause() {
            if (myVideo.paused) {
                myVideo.play();
            }
            else {
                myVideo.pause();
            }
        }

        function makeBig() {
            myVideo.width = 600;
        }

        function makeSmall() {
            myVideo.width = 350;
        }

        function makeNormal() {
            myVideo.width = 450;
        }
    </script>
</body>
</html>
