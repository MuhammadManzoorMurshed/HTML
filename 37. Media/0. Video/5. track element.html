<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <video width="400" height="300" controls>
        <source src="movie.mp4" type="video/mp4">
        <source src="movie.ogg" type="video/ogg">
        
        <track src="#_en.vtt" kind="subtitles" srclang="en" label="English">
        <track src="#_bn.vtt" kind="subtitles" srclang="bn" label="Bangla">
        
         Your browser does not support the video tag.
    </video>
    
    <p><b>Note: </b>This element is used to specify subtitles, caption files or other files containing text, that should be visible when the media is playing.</p>
    <p>Tracks are formatted in WebVTT format (.vtt files).</p>
</body>
</html>
