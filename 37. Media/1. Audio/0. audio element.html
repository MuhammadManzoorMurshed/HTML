<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <audio controls>
        <source src="horse.ogg" type="audio/ogg">
        <source src="horse.mp3" type="audio/mpeg">
        
        Your browser does not support the audio element.
    </audio>
    
    <p>The controls attribute adds audio controls, like play, pause, and volume.</p>
    <p>The &lt;source&gt; element allows you to specify alternative audio files which the browser may choose from. The browser will use the first recognized format.</p>
</body>
</html>
