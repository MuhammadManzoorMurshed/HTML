<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <p>UTF-8 is identical to ASCII for the values from 0 to 127.</p>
    <p>UTF-8 does not use the values from 128 to 159. </p>
    <p>UTF-8 is identical to both ANSI and 8859-1 for the values from 160 to 255.</p>
    <p>UTF-8 continues from the value 256 with more than 10 000 different characters.</p>
</body>
</html>
