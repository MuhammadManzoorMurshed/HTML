<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <p>The textarea element defines a multi-line input field.</p>
    
    <form action="#" method="#">
        <label for="message">Write something about yourself:</label> <br>
        <textarea name="message" id="message" cols="50" rows="15">The cat was playing in the garden.</textarea> <br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
