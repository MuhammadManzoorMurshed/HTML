<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    
    <style>
        textarea{
            width: 400px;
            height: 200px;
        }
    </style>
</head>
<body>
    <h2>Styling Textarea</h2>
    <p>Use CSS to change the size of the textarea.</p>
    
    <form action="#" method="#">
        <label for="message">Write something about yourself:</label> <br>
        <textarea name="message" id="message">The cat was playing in the garden.</textarea> <br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
