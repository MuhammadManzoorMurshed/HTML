<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <h2>The input list attribute</h2>
    <p>The list attribute refers to a datalist element that contains pre-defined options for an input element.</p>
    
    <form action="#" method="#">
       <label for="browser">Select a browser:</label>
        <input id="browser" list="browsers" name="browsers">
        <datalist id="browsers">
            <option value="Internet Explorer">
            <option value="Firefox">
            <option value="Chrome">
            <option value="Opera Browser">
            <option value="Safari">
        </datalist> <br> <br>
        
        <input type="submit" value="Submit">
        
    </form>
</body>
</html>
