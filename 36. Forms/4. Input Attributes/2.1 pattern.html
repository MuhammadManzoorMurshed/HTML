<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <h2>The input pattern attribute</h2>
    <p>The pattern attribute specifies a regular expression that the input element's value is checked against.</p>
    
    <form action="#" method="#">
        <label for="countryCode">Country Code:</label> <br>
        <input type="text" id="countryCode" name="countryCode" pattern="[A-Za-z]{3}" title="Three letter country code.">
        
        <input type="submit" value="Submit">
    </form>
</body>
</html>
