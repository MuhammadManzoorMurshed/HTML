<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <p>The input size attribute specifies the visible width, in characters, of an input field. The default value for size is 20. The size attribute works with the following input types: text, search, tel, url, email, and password.</p>
    
    <form action="#" method="#">
        <label for="fn">First Name:</label> <br>
        <input type="text" id="fn" name="fn" value="Manzoor" size="30"> <br>
        <label for="ln">Last Name:</label> <br>
        <input type="text" id="ln" name="ln" value="Murshed" size="30"> <br>
        <label for="pass">Password:</label> <br>
        <input type="password" id="pass" name="pass" size="20"> <br>
        <label for="phone">Phone</label> <br>
        <input type="tel" id="phone" name="phone" size="20"> <br>
        <label for="mail">Email:</label> <br>
        <input type="email" id="mail" name="mail" size="50"> <br>
        <label for="link">Search by URL:</label> <br>
        <input type="url" id="link" name="link" size="65"> <br>
        <label for="s">Type a link:</label> <br>
        <input type="search" id="s" name="s" size="10">
        
        <br> <br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
