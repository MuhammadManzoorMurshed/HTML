<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <h2>Telephone Field</h2>
    <p>The input type="tel" is used for input fields that should contain a telephone number.</p>
    
    <form action="#" method="#">
        <label for="phone">Enter a phone number:</label> <br>
        <input type="tel" id="phone" name="phone" placeholder="123-45-678" pattern="[0-9]{3}-[0-9]{2}-[0-9]{3}" required> <br>
        <small>Format: 123-45-678</small> <br> <br>
        <input type="submit" value="Submit">
    </form>
    <p>The required attribute works with the following input types: text, search, url, tel, email, password, date pickers, number, checkbox, radio, and file.</p>
</body>
</html>
