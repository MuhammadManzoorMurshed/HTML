<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <h2>The input autofocus attribute</h2>
    <p>The autofocus attribute specifies that the input field should automatically get focus when the page loads.</p>
    
    <form action="#" method="#">
        <label for="fn">First Name:</label> <br>
        <input type="text" id="fn" name="fn" autofocus> <br>
        
        <label for="ln">Last Name:</label> <br>
        <input type="text" id="ln" name="ln"> <br> <br>
        
        <input type="submit" value="Submit">
    </form> 
</body>
</html>
