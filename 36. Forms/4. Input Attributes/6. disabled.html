<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <p>A disabled input field is unusable and un-clickable. The value of a disabled input field will not be sent when submitting the form!</p>
    
    <form action="#" method="#">
        <label for="fn">First Name:</label> <br>
        <input type="text" id="fn" name="fn" value="Manzoor" readonly> <br>
        <label for="ln">Last Name:</label> <br>
        <input type="text" id="ln" name="ln" value="Murshed" disabled> <br> <br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
