<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <h2>The input multiple attributes</h2>
    
    <form action="#" method="#">
        <label for="files">Select files:</label>
        <input type="file" id="files" name="files" multiple> <br> <br>
        
        <input type="submit" value="Submit">
    </form>
    
    <p>The input multiple attribute specifies that the user is allowed to enter more than one value in an input field.. The multiple attribute works with the following input types: email, and file.</p>
    <p>To select multiple files, hold down the CTRL or SHIFT key while selecting.</p>
</body>
</html>
