<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <h2>The input height and width attributes</h2>
    <p>The height and width attributes specify the height and width of an input type="image" element.</p>
    
    <form action="#" method="#">
        <label for="fn">First Name:</label>
        <input type="text" id="fn" name="fn"> <br> <br>
        
        <label for="ln">Last Name:</label>
        <input type="text" id="ln" name="ln"> <br> <br>
        <input type="image" src="img_submit.gif" alt="Submit" width="45" height="45">
    </form>
    
    <p><b>Note:</b> The input type="image" sends the X and Y coordinates of the click that activated the image button.</p>
</body>
</html>
