<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <h2>The input min and max attributes</h2>
    <p>The min and max attributes specify the minimum and maximum values for an input element.</p>
    
    <form action="#" method="#">
        <label for="dateMax">Enter a date before 1980-01-01:</label>
        <input type="date" id="dateMax" name="dateMax" max="1979-12-31"> <br> <br>
        
        <label for="dateMin">Enter a date after 2000-01-01:</label>
        <input type="date" id="dateMin" name="dateMin" min="2000-01-02"> <br> <br>
        
        <label for="quantity">Quantity (between 1 and 5):</label>
        <input type="number" id="quantity" name="quantity" min="1" max="5"> <br> <br>
        
        <input type="submit" value="Submit">
    </form>
    
    <p>The min and max attributes work with the following input types: number, range, date, datetime-local, month, time and week.</p>
</body>
</html>
