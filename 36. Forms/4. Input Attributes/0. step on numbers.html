<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <h2>Number Field</h2>
    <p>The input type="number" defines a numeric input field.</p>
    
    <form action="#" method="#">
        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" name="quantity" min="0" max="100" step="5" value="25">
        <input type="submit" value="Submit">
    </form>
    <p>The step attribute works with the following input types: number, range, date, datetime-local, month, time and week.</p>
</body>
</html>
