<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <p>A read-only input field cannot be modified (however, a user can tab to it, highlight it, and copy the text from it). The value of a read-only input field will be sent when submitting the form!</p>
    
    <form action="#" method="#">
        <label for="fn">First Name:</label> <br>
        <input type="text" id="fn" name="fn" value="Manzoor" readonly> <br>
        <label for="ln">Last Name:</label> <br>
        <input type="text" id="ln" name="ln" value="Murshed"> <br> <br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
