<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <h2>HTML Forms</h2>
    
    <form action="/action_page.php" target="_top">
        <label for="fname">First Name:</label> <br>
        <input type="text" id="fname" name="fname" value="John"> <br>
        <label for="lname">Last Name:</label> <br>
        <input type="text" id="lname" name="lname" value="Doe"> <br> <br>
        <input type="submit" value="Submit">
    </form>
    
    <p>If you click the "Submit" button, the form-data will be sent to a page called "/action_page.php". If the action attribute is omitted, the action is set to the current page.</p>
</body>
</html>
