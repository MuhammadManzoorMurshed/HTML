<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <h2>The method Attribute</h2>
    <p>This form will be submitted using the POST method.</p>
    
    <form action="/action_page.php" target="_blank" method="post">
        <label for="fn">First name:</label> <br>
        <input type="text" id="fn" name="fn" value="John"> <br>
        
        <label for="ln">Last Name:</label> <br>
        <input type="text" id="ln" name="ln" value="Doe"> <br> <br>
        
        <input type="submit" value="Submt">
    </form>
    
    <p><i>After you submit, notice that the form values is visible in the address bar of the new browser tab.</i></p>
    
    <p><strong>Tip: </strong><i>Always use POST if the form data contains sensitive or personal information!</i></p>
</body>
</html>
