<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <p>The novalidate attribute is a &lt;input&gt;  attribute.</p>
    
    <form action="#" method="#" novalidate>
        <label for="mail">Enter your email:</label> <br>
        <input type="email" id="mail" name="mail" required> <br> <br>
        
        <input type="submit" value="Submit">
    </form>
    
    <p><b>Note: </b> When present, novalidate specifies that all of the form-data should not be validated when submitted.</p>
</body>
</html>
