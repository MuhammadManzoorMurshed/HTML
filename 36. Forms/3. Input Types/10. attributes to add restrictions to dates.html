<!DOCTYPE html>
<html lang="en">

    <meta charset="UTF-8">
    <title>`</title>
</head>
<body>
    <h2>Date Field Restrictions</h2>
    <p>Use the min and max attributes to add restrictions to dates.</p>
    
    <form action="#" method="#">
        <label for="datemin">Enter a date after 2000-03-05:</label>
        <input type="date" id="datemin" name="datemin" min="2010-03-06"> <br> <br>
        
        <label for="datemax">Enter a date before 2000-02-06:</label>
        <input type="date" id="datemax" name="datemax" max="2000-02-05">
    </form>
</body>
</html>
