<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <h2>File upload</h2>
    <p>Show a file-select field which allows a file to be chosen for upload.</p>
    
    <form action="#" method="#">
        <label for="myfile">Select a file:</label>
        <input type="file" id="myfile" name="myfile"> <br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
