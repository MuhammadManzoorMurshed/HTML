<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <h2>Display a Week Input Control</h2>
    <p>The input type="week" allows the user to select a week and year.</p>
    
    <form action="#" method="#">
        <label for="week">Select a week:</label> <br>
        <input type="week" id="week" name="week">
        <input type="submit" value="Submit">
    </form>
</body>
</html>
