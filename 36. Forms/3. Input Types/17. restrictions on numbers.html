<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <h2>Number Field</h2>
    <p>The input type="number" defines a numeric input field.</p>
    
    <form action="#" method="#">
        <label for="quantity">Quantity (between 0 and 9:</label>
        <input type="number" id="quantity" name="quantity" min="0" max="9">
        <input type="submit" value="Submit">
    </form>
</body>
</html>
