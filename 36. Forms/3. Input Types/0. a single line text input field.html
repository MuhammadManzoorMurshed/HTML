<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <h2>Text field</h2>
    <p>The <strong>input type="text"</strong>defines a one-line text input field.</p>
    
    <form action="#" method="#">
        <label for="fn">First Name:</label> <br>
        <input type="text" id="fn" name="fn"> <br>
        
        <label for="ln">Last Name:</label> <br>
        <input type="text" id="ln" name="ln"> <br> <br>
        
        <input type="submit" value="Submit">
    </form>
    
    <p><b>Note: </b>Note that the form itself is not visible. Also note that the default width of a text field is 20 characters.</p>
</body>
</html>
