<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <h2>Local Date Field</h2>
    <p>The input type="datetime-local" specifies a date and time input field, with no time zone.</p>
    
    <form action="#" method="#">
        <label for="dtl">Birthday (date and time):</label>
        <input type="datetime-local" id="dtl" name="dtl">
        <input type="submit" value="Submit">
    </form>
</body>
</html>
