<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <h2>Submit button</h2>
    <p>The <strong>input type="submit"</strong>strong> defines a button for submitting form data to a form-handler</p>
    
    <form action="/action_page.php" method="#">
        <label for="fn">First Name:</label> <br>
        <input type="text" id="fn" name="fn"> <br>
        
        <label for="ln">Last Name:</label> <br>
        <input type="text" id="ln" name="ln"> <br> 
        
        <label for="pass">Password:</label> <br>
        <input type="password" id="pass" name="pass"> <br> <br>
        
        <input type="submit" value="Submit">
    </form>
    
    <p><b>Note: </b>If you click "Submit", the form-data will be sent to a page called "/action_page.php".</p>
</body>
</html>
