<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <h2>Checkboxes</h2>
    
    <form action="/action_page.php" method="#">
        <label for="fn">First Name:</label> <br>
        <input type="text" id="fn" name="fn" value="Muhammad Manzoor"> <br>
        
        <label for="ln">Last Name:</label> <br>
        <input type="text" id="ln" name="ln" value="Murshed"> <br> <br>
        
        <label>Choose your favorite Web language:</label> <br>
        <input type="radio" id="html" name="fav_lang" value="HTML"> 
        <label for="html">HTML</label> <br>
        
        <input type="radio" id="css" name="fav_lang" value="CSS">
        <label for="css">CSS</label> <br>
        
        <input type="radio" id="js" name="fav_lang" value="JavaScript"> 
        <label for="js">JavaScript</label> <br> 
        <br>
        
        <label>Check the boxes:</label> <br>
        <input type="checkbox" id="vehicle0" name="vehicle0" value="bike">
        <label for="vehicle0">I have a bike</label> <br>
        
        <input type="checkbox" id="vehicle1" name="vehicle1" value="car">
        <label for="vehicle1">I have a car</label> <br>
        
        <input type="checkbox" id="vehicle2" name="vehicle2" value="boat">
        <label for="vehicle2">I have a boat</label> <br> <br>
        
        <label for="pass">Password:</label> <br>
        <input type="password" id="pass" name="pass" value="12345"> <br>
        
        <label for="pass">Confirm Password:</label> <br>
        <input type="password" id="pass" name="pass"> <br> <br>
        
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>
</body>
</html>
