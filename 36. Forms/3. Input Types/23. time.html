<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <h2>Show a Time Input Control</h2>
    <p>The input type="time" allows the user to select a time (no time zone).</p>
    
    <form action="#" method="#">
        <label for="appt">Select a time:</label>
        <input type="time" id="appt" name="appt"> <br> <br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
