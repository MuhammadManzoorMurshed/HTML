<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <h2>Display a URL Input Field</h2>
    <p>The input type="url" is used for input fields that should contain a URL address.</p>
    
    <form action="#" method="#">
        <label for="homepage">Search by url:</label> <br>
        <input type="url" id="homepage" name="homepage">
        <input type="submit" value="Submit">
    </form>
</body>
</html>
