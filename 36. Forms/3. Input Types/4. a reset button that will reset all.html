<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <h2>Reset button</h2>
    
    <form action="/action_page.php" method="#">
        <label for="fn">First Name:</label> <br>
        <input type="text" id="fn" name="fn" value="Muhammad Manzoor"> <br>
        
        <label for="ln">Last Name:</label> <br>
        <input type="text" id="ln" name="ln" value="Murshed"> <br> 
        
        <label for="pass">Password:</label> <br>
        <input type="password" id="pass" name="pass" value="12345"> <br> <br>
        
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
    </form>
    
    <p><b>Note: </b>If you change the input values and then click the "Reset" button, the form-data will be reset to the default values.</p>
</body>
</html>
