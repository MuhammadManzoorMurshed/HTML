<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <h2>Show a Color Picker</h2>
    <p>The input type="color" is used for input fields that should contain a color.</p>
    
    <form action="#" method="#">
        <label for="fav_col">Select your favorite color:</label>
        <input type="color" id="fav_col" name="fav_col" value="#ff0000"> <br>
        <input type="submit" value="Submit">
    </form>
</body>
</html>
