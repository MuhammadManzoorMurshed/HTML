<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <form action="/action_page.php">
       <label for="fname">First Name:</label> <br>
        <input type="text" id="fname" name="fname" value="John"> <br>
        <label for="lname">Last Name:</label> <br>
        <input type="text" id="lname" name="lname" value="Peter"> <br> <br>
        
        <p style="margin-bottom: 0;">Select any option:</p>
        <input type="checkbox" id="vehicle1" name="vehicle1" value="Bike">
        <label for="vehicle1">I have a bike</label> <br>
        <input type="checkbox" id="vehicle2" name="vehicle2" value="Car">
        <label for="vehicle2">I have a car</label> <br>
        <input type="checkbox" id="vehicle3" name="vehicle3" value="Boat">
        <label for="vehicle3">I have a boat</label> <br>
        <input type="submit" value="Submit">
    </form>
    
    <p>The &lt;input type="submit"&gt; defines a button for submitting the form data to a form-handler. The form-handler is typically a file on the server with a script for processing input data. The form-handler is specified in the form's action attribute.</p>
</body>
</html>
