<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <p>Image to use.</p>
    <img id="scream" src="img_the_scream.jpg" alt="The Scream" width="250" height="300">
    
    <p>Canvas to fill.</p>
    <canvas id="myCanvas" width="270" height="320" style="1px solid #d3d3d3;">
        
        Your browser does not support the HTML canvas tag.
    </canvas>
    
    <p>
        <button onclick="myCanvas()">
            Try it!
        </button>
    </p>
    
    <script>
        function myCanvas() {
            var c = document.getElementById("myCanvas");
            var ctx = c.getContext("2d");
            var img = document.getElementById("scream");
            
            ctx.drawImage(img, 100, 150);
        }
    </script>
</body>
</html>
