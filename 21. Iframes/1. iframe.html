<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <h2>iframe Syntax</h2>
    
    <p>An HTML iframe is used to display a web page within a web page.</p>
    <p>The HTML &lt;iframe&gt; tag specifies an inline frame.</p>
    <p>An inline frame is used to embed another document within the current HTML document.</p>
    
    <iframe src="0.%20Example.html"></iframe>
</body>
</html>
