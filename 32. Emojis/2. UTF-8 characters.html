<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <p>Many UTF-8 characters cannot be typed on a keyboard, but they can always be displayed using numbers (called entity numbers)</p>
    <ul>
        <li>A is 65</li>
        <li>B is 66</li>
        <li>C is 67</li>
    </ul>
    
    <p>I will display A, B, C.</p>
    <p>I will display &#65;, &#66;, &#67;.</p>
</body>
</html>
