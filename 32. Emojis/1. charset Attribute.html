<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> <!--HTML charset Attribute-->
    <title>Document</title>
</head>
<body>
    <p>To display an HTML page correctly, a web browser must know the character set used in the page.</p>
    <p>This is specified in the &lt;meta&gt; tag</p>
    <p>If not specified, UTF-8 is the default character set in HTML.</p>
</body>
</html>
