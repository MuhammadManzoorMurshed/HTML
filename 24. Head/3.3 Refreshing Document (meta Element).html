<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> <!--To define CharacterSet-->
    <meta name="keywords" content="HTML, CSS, Javascript"> <!--To define Keywords for Search Engines-->
    <meta name="description" content="Free Web Tutorials"> <!---To define a Description of Web Pages-->
    <meta name="author" content="Muhammad Manzoor Murshed"> <!--To define the Author of a Page-->
    <meta http-equiv="refresh" content="30"> <!---To refresh Document every 30 seconds-->
    
    <title>Document</title>
</head>
<body>
    <p>The <span style="color: red;">&lt;meta&gt;</span> element is typically used to specify the character set, page description, keywords, author of the document, and viewport settings.</p>
</body>
</html>
