<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>

<body>
    <h1>My First JavaScript</h1>
    <p>Here, a JavaScript changes the value of the src (source) attribute of an image.</p>
    
    <img src="pic_bulboff.gif" id="myBulb" alt="BulbOff" width="100px" height="180px">
    <p>
        <button type="button" onclick="light(1)">
            Light On
        </button>
        <button type="button" onclick="light(0)">
            Light Off
        </button>
    </p>
    
    <script>
        function light(sw){
            var pic;
            if(sw == 0)
                {
                    pic = "pic_bulboff.gif";
                }
            else
                {
                    pic = "pic_bulbon.gif"; 
                }
            
            document.getElementById('myBulb').src = pic;
        }
    </script>
</body></html>
