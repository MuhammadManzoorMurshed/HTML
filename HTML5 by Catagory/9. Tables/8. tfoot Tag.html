<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    
    <style>
        table, th, td{
            border: 1px solid black;
        }
        thead{
            color: green;
        }
        tbody{
            color: blueviolet;
        }
        tfoot{
            color: red;
        }
    </style>
    
</head>
<body>
    <table>
       <caption>Monthly Savings</caption>
       <thead>
            <tr>
               <th>SL. No.</th>
                <th>Month</th>
                <th>Savings</th>
            </tr>
        </thead>
        <tbody>
            <tr>
               <td>01</td>
                <td>January</td>
                <td>$100</td>
            </tr>
            <tr>
               <td>02</td>
                <td>February</td>
                <td>$80</td>
            </tr>
            <tr>
               <td>03</td>
                <td>March</td>
                <td>$40</td>
            </tr>
            <tr>
               <td>04</td>
                <td>April</td>
                <td>$70</td>
            </tr>
            <tr>
               <td>05</td>
                <td>May</td>
                <td>$90</td>
            </tr>
            <tr>
               <td>06</td>
                <td>June</td>
                <td>$65</td>
            </tr>
        </tbody>  
        <tfoot>  
        <tr>
            <td colspan="2">Total Amount</td>
            <td>$445</td>
        </tr>
        </tfoot>
    </table>
</body>
</html>
