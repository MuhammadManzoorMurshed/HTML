<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    
    <style>
        table, th, td{
            border: 1px solid black;
        }
        thead{
            color: green;
        }
    </style>
    
</head>
<body>
    <table>
       <caption>Monthly Savings</caption>
       <thead>
            <tr>
                <th>Month</th>
                <th>Savings</th>
            </tr>
        </thead>
        <tr>
            <td>January</td>
            <td>$100</td>
        </tr>
        <tr>
            <td>February</td>
            <td>$80</td>
        </tr>
        <tr>
            <td>March</td>
            <td>$40</td>
        </tr>
        <tr>
            <td>April</td>
            <td>$70</td>
        </tr>
        <tr>
            <td>May</td>
            <td>$90</td>
        </tr>
        <tr>
            <td>June</td>
            <td>$65</td>
        </tr>
        <tr>
            <td>Total</td>
            <td>$445</td>
        </tr>
    </table>
</body>
</html>
