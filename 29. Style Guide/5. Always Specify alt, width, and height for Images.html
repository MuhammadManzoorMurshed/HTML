<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
    <p>Always specify the alt attribute for images. This attribute is important if the image for some reason cannot be displayed.</p>
    <p>Also, always define the width and height of images. This reduces flickering, because the browser can reserve space for the image before loading.</p>
    
    <!--Good-->
    <img src="shot_1295820312.gif" alt="HTML5" style="width:128px;height:128px"> <br>
    
    <!--Bad-->
    <img src="shot_1295820312.gif">
</body>
</html>
